# 생성 파일. 직접 고치지 말고 scripts/gen-config.mjs 를 고치세요.
# 주소·start_block 은 contracts/deployments/10143.json, 이벤트 시그니처는
# packages/shared/src/abi/*.json 에서 나온다. 갱신은 `pnpm indexer:config`.
# 로컬 실행은 RPC_URL=… pnpm indexer:config 로 rpc 소스를 붙여 다시 만든다.
name: monti
description: MONTI on-chain index (Monad 10143)
schema: schema.graphql
# `CheckIn.txHash` 와 `Override.id`(= txHash-logIndex) 가 트랜잭션 해시를 쓴다.
# field_selection 없이는 `event.transaction` 이 **빈 객체**라 해시를 읽을 수 없다
# (Envio 기본값). 해시 하나만 고른다 — 고른 필드마다 동기화가 느려진다.
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: Identity
    handler: src/EventHandlers.ts
    events:
      - event: Registered(bytes32 indexed personId, address indexed account)
      - event: AccountRotated(bytes32 indexed personId, address indexed oldAccount, address indexed newAccount)
      - event: RotationCancelled(bytes32 indexed personId, address indexed account)
      - event: DeviceChanged(address indexed account, bytes32 x, bytes32 y)
      - event: DeviceLocked(address indexed account, bool locked)
      - event: KycLevelSet(address indexed account, uint8 level)
  - name: Organizers
    handler: src/EventHandlers.ts
    events:
      - event: OrganizerCreated(uint256 indexed orgId, address indexed owner)
      - event: AdminSet(uint256 indexed orgId, address indexed admin, uint32 bits)
      - event: ManagerSet(uint256 indexed orgId, address indexed manager, bool exists, bool canApprove)
      - event: OwnerTransferred(uint256 indexed orgId, address indexed from, address indexed to)
      - event: GateRegistered(uint256 indexed gateId, uint256 indexed eventId, address indexed gateAccount, bytes32 kx, bytes32 ky)
      - event: GateRevoked(uint256 indexed gateId)
      - event: GateOpened(uint256 indexed gateId)
      - event: GateClosed(uint256 indexed gateId)
  - name: Ticket
    handler: src/EventHandlers.ts
    events:
      - event: EventCreated(uint256 indexed eventId, uint256 indexed orgId, address indexed creator)
      - event: EventStatusChanged(uint256 indexed eventId, uint8 status)
      - event: Claimed(uint256 indexed tokenId, uint256 indexed eventId, address indexed to, uint8 tier)
      - event: ClaimRequested(uint256 indexed eventId, uint256 indexed requestId, address indexed requester, uint8 tier)
      - event: ClaimApproved(uint256 indexed eventId, uint256 indexed requestId, uint256 tokenId)
      - event: ClaimRejected(uint256 indexed eventId, uint256 indexed requestId)
      - event: Transfer(address indexed from, address indexed to, uint256 indexed tokenId)
      - event: CheckedIn(uint256 indexed tokenId, uint256 indexed eventId, uint256 indexed gateId, bytes32 nonceHash, uint64 ts)
      - event: CheckedInLate(uint256 indexed tokenId, uint256 indexed gateId, uint64 issuedAt, uint64 ts)
      - event: ManualOverride(uint256 indexed tokenId, uint256 indexed gateId, address indexed approver, uint8 role, uint8 reason)
      - event: Revoked(uint256 indexed tokenId, uint8 reason)
      - event: Migrated(uint256 indexed tokenId, address indexed from, address indexed to)
      - event: OfferCreated(uint256 indexed tokenId, address indexed from, bytes32 recipientCommitment, uint64 expiresAt)
      - event: OfferCancelled(uint256 indexed tokenId)
      - event: OfferAccepted(uint256 indexed tokenId, address indexed from, address indexed to)
  - name: SettlementVault
    handler: src/EventHandlers.ts
    events:
      - event: PolicySet(uint256 indexed eventId, address indexed organizer, bytes32 policyHash, uint32 version)
      - event: Deposited(uint256 indexed eventId, uint256 indexed tokenId, address token, uint128 amount, address payer)
      - event: Released(uint256 indexed eventId, uint256 indexed tokenId, address token, uint256 amount)
      - event: NoShowSettled(uint256 indexed eventId, uint256 indexed tokenId, address token, uint256 amount)
      - event: Refunded(uint256 indexed eventId, uint256 indexed tokenId, address token, uint256 amount, address payer)
      - event: Paid(uint256 indexed eventId, uint256 indexed tokenId, address indexed recipient, uint256 amount, bytes32 reasonHash)
      - event: PayoutDeferred(uint256 indexed eventId, uint256 indexed tokenId, address indexed recipient, address token, uint256 amount)
      - event: Withdrawn(address indexed recipient, address indexed token, uint256 amount)
      - event: TokenAllowed(address indexed token, bool allowed)
      - event: DepositorSet(address indexed account, bool allowed)
networks:
  - id: 10143
    start_block: 66724502
    contracts:
      - name: Identity
        address:
          - "0x10Fa9977363c40240381BEEfFc2D997BC9Edcd6b"
      - name: Organizers
        address:
          - "0xAF80CbfDD08284E3aae67FFaaf20A27E281C360A"
      - name: Ticket
        address:
          - "0x7E1fdfCB3688C5b0539101cEAE6a7Ee5bD9b51Cf"
      - name: SettlementVault
        address:
          - "0xA84FDb64C9DDc3B25eF8BDeA58561BDbE53ABD69"
