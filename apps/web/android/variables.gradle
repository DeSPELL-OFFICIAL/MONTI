ext {
    // 31, not the template default of 24: @monti/device-key needs KeyInfo.getSecurityLevel()
    // to read back whether the key really landed in StrongBox, and the plugin module
    // hardcodes that floor. A lower number here fails the manifest merge rather than
    // lowering it. android-staff/variables.gradle says 31 for the same reason.
    minSdkVersion = 31
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}