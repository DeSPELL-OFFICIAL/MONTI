# remappings.txt rejects comments, so the note about its two context-scoped entries
# (`<context>:<prefix>=<target>`, which apply only to files under `<context>`) lives here.
#
#   lib/account-abstraction/:@openzeppelin/contracts/=test/shims/openzeppelin-v4/
#     EntryPoint v0.6 predates OpenZeppelin 5, which the rest of this repo is on. The shim gives
#     the vendored EntryPoint the v4 layout it expects without downgrading anything else.
#
#   lib/smart-wallet/:{solady,account-abstraction,openzeppelin-contracts}/=lib/smart-wallet/lib/...
#     Coinbase's wallet is audited against the dependencies it vendors -- solady 0.0.175, whose
#     LibClone lays the ERC-1967 proxy out differently from this repo's solady 0.1.26. Resolving
#     it against our copies would silently change the deployed wallet's bytecode, and with it every
#     account address the factory predicts. The context keeps the two trees apart.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# No project-wide solc pin: lib/smart-wallet pins `pragma solidity 0.8.23` exactly, so a single
# pinned version cannot build the tree. Nothing is lost by dropping it -- every first-party
# contract, test and script pins `pragma solidity 0.8.31;` in its own header, which is the stronger
# guarantee. forge builds src/, test/ and script/ with 0.8.31 and the vendored Coinbase sources
# with 0.8.23, as two compilation units.
auto_detect_solc = true
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
