# remappings.txt rejects comments, so the note about its two context-scoped entries
# (`<context>:<prefix>=<target>`, which apply only to files under `<context>`) lives here.
#
#   lib/account-abstraction/:@openzeppelin/contracts/=test/shims/openzeppelin-v4/
#     EntryPoint v0.6 predates OpenZeppelin 5, which the rest of this repo is on. The shim gives
#     the vendored EntryPoint the v4 layout it expects without downgrading anything else.
#
#   lib/smart-wallet/:{solady,account-abstraction,openzeppelin-contracts}/=lib/smart-wallet/lib/...
#     Coinbase's wallet is audited against the dependencies it vendors -- solady 0.0.175, whose
#     LibClone lays the ERC-1967 proxy out differently from this repo's solady 0.1.26. Resolving
#     it against our copies would silently change the deployed wallet's bytecode, and with it every
#     account address the factory predicts. The context keeps the two trees apart.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# No project-wide solc pin: lib/smart-wallet pins `pragma solidity 0.8.23` exactly, so a single
# pinned version cannot build the tree (and compilation_restrictions cannot override a pin -- forge
# resolves the pin first and then fails on `=0.8.23`). Nothing is lost by dropping it: every
# first-party source pins its own exact version in its own header -- 0.8.31 everywhere except
# DeployCoinbaseFactory.s.sol and its test, which import the Coinbase wallet and so must join its
# 0.8.23 unit. forge builds two units: 88 files at 0.8.31, 38 at 0.8.23.
#
# On a cold checkout forge downloads solc 0.8.23 on the first build, once, alongside 0.8.31. Note
# also that `evm_version` below is capped per compiler: the 0.8.23 unit is emitted for shanghai,
# the newest target that compiler knows. That is a subset of what Monad executes, so it runs.
auto_detect_solc = true
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# Monad 는 런타임 128 KB 를 받는다. EIP-170 의 24,576 B 는 이 체인의 한도가 아니다.
# 다만 forge 1.5.1 에서 이 키가 실제로 지배하는 것은 아무것도 없다(실측):
#   - `forge build --sizes` 는 이 값을 무시하고 24,576 / 49,152 를 하드코딩해 초과 시 종료 코드 1
#   - `forge test` / `forge script` 는 런타임 크기를 애초에 강제하지 않는다
#   - 따라서 EIP-3860 이니트코드 상한도 이 값에서 유도되지 않는다
# 그래서 .github-checks.sh 는 `--sizes` 를 돌리지 않고, 진짜 게이트는 test/ContractSize.t.sol 이
# 들고 있다(네 컨트랙트의 런타임·이니트코드를 131,072 와 직접 비교한다). 이 줄은 값이 맞게 적힌
# 전방 호환 선언이다 — --sizes 가 code_size_limit 을 존중하는 Foundry 가 나오면 그때부터 먹는다.
code_size_limit = 131072
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
