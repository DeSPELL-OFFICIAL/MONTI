# Every first-party source is now on solc 0.8.31 (see the header of each file). The ERC-4337
# paymaster and the Coinbase-wallet factory script -- the only consumers of account-abstraction and
# lib/smart-wallet, and the only files that pinned an older solc -- were retired with the move to the
# ERC-2771 forwarder (design 2026-09-29 relayed phase 2, section 3), so remappings.txt no longer
# carries any context-scoped (`<context>:<prefix>=<target>`) entries.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# No project-wide solc pin: every first-party source pins its own exact version in its own header
# (0.8.31 throughout). auto_detect_solc lets forge honour those pins directly.
auto_detect_solc = true
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# Monad 는 런타임 128 KB 를 받는다. EIP-170 의 24,576 B 는 이 체인의 한도가 아니다.
# 다만 forge 1.5.1 에서 이 키가 실제로 지배하는 것은 아무것도 없다(실측):
#   - `forge build --sizes` 는 이 값을 무시하고 24,576 / 49,152 를 하드코딩해 초과 시 종료 코드 1
#   - `forge test` / `forge script` 는 런타임 크기를 애초에 강제하지 않는다
#   - 따라서 EIP-3860 이니트코드 상한도 이 값에서 유도되지 않는다
# 그래서 .github-checks.sh 는 `--sizes` 를 돌리지 않고, 진짜 게이트는 test/ContractSize.t.sol 이
# 들고 있다(네 컨트랙트의 런타임·이니트코드를 131,072 와 직접 비교한다). 이 줄은 값이 맞게 적힌
# 전방 호환 선언이다 — --sizes 가 code_size_limit 을 존중하는 Foundry 가 나오면 그때부터 먹는다.
code_size_limit = 131072
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
