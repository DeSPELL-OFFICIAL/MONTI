[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
